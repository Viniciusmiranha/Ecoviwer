<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Categorias | Ecoviwer</title>

  <link rel="stylesheet" href="categoria.css">
</head>

<body>

  <!-- BACKGROUND -->
  <div class="background"></div>

  <!-- DECORAÇÕES -->
  <img src="img/folha-esquerda.png" class="decor decor-left" alt="">
  <img src="img/folha-direita.png" class="decor decor-right" alt="">

  <!-- SETA ESQUERDA -->
  <button class="nav-arrow arrow-left">
    &#10094;
  </button>

  <!-- SETA DIREITA -->
  <button class="nav-arrow arrow-right">
    &#10095;
  </button>

  <!-- CONTEÚDO -->
  <main class="container">

    <!-- LOGO -->
    <header class="header">
      <img src="/img/logo.png" alt="Ecoviwer" class="logo">
    </header>

    <!-- TEXTOS -->
    <section class="hero">

      <h1 class="title">
        Tipos de Plantas
      </h1>

      <p class="subtitle">
        Selecione o tipo de planta que deseja explorar
        e descubra informações detalhadas sobre
        suas características e benefícios.
      </p>

    </section>

      <!-- CARDS -->
    <section class="cards-wrapper" id="cardsWrapper"></section>

    <!-- BOLINHAS -->
    <div class="pagination" id="pagination"></div>

  </main>

  <script src="categoria.js"></script>

</html>
